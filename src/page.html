<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vntext</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #16161a; color: #e8e6e3; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1rem 40vh; }
  .msg { padding: .9rem 0; border-bottom: 1px solid #2a2a31; opacity: .55; }
  .msg:last-child { opacity: 1; border-bottom: 0; }
  .name { color: #e0a458; font-size: .95rem; margin-bottom: .2rem; }
  .jp { font: 1.55rem/1.7 "Noto Serif CJK JP", "Noto Sans CJK JP", serif; white-space: pre-wrap; }
  .tr { color: #9ecbff; margin: .5rem 0 .3rem; white-space: pre-wrap; min-height: 1.2em; }
  .tr.pending { color: #666; }
  #status { position: fixed; right: .8rem; bottom: .6rem; font-size: .8rem; color: #777; }
</style>
<main id="log"></main>
<div id="status">connecting…</div>
<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const translation = new Map(); // seq -> .tr element

  function show(m) {
    if (document.getElementById('m' + m.seq)) return;
    const box = document.createElement('div');
    box.className = 'msg';
    box.id = 'm' + m.seq;
    if (m.name) {
      const name = document.createElement('div');
      name.className = 'name';
      name.lang = 'ja';
      name.textContent = m.name;
      box.append(name);
    }
    for (const line of m.lines) {
      const jp = document.createElement('div');
      jp.className = 'jp';
      jp.lang = 'ja';
      jp.textContent = line;
      box.append(jp);
    }
    if (m.translating) {
      const tr = document.createElement('div');
      tr.className = 'tr pending';
      tr.textContent = '…';
      box.append(tr);
      translation.set(m.seq, tr);
    }
    log.append(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function fill(t) {
    const slot = translation.get(t.seq);
    if (slot) { slot.textContent = t.tr; slot.classList.remove('pending'); }
  }

  const events = new EventSource('/events');
  events.onopen = () => status.textContent = 'connected';
  events.onerror = () => status.textContent = 'disconnected, retrying…';
  events.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.type === 'message') show(data);
    else if (data.type === 'translation') fill(data);
  };
</script>
</html>

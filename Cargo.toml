[package]
name = "vntext"
version = "0.1.0"
edition = "2021"

[dependencies]
memchr = "2"
miniz_oxide = "0.8"
aes = "0.8"
cbc = "0.1"
encoding_rs = "0.8"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
lzma-rs = "0.3.0"
x11rb = { version = "0.14.0", features = ["res"] }
gtk4 = { version = "0.11.5", features = ["v4_10"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2"
zbus = { version = "5", features = ["blocking-api"] }
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = 3
debug = 1

[package]
name = "vntext"
version = "0.1.0"
edition = "2021"

[dependencies]
memchr = "2"
miniz_oxide = "0.8"
aes = "0.8"
cbc = "0.1"
encoding_rs = "0.8"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
lzma-rs = "0.3.0"
x11rb = "0.14.0"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"

[profile.release]
opt-level = 3
debug = 1
